# Database migrations. The app applies them itself on startup (see app/db/__init__.py),
# so a deploy never runs against an out-of-date schema. To add one after changing
# app/db/tables.py, from the backend directory:
#     alembic revision --autogenerate -m "describe the change"
# then read the generated file in migrations/versions before committing it.
# The database URL comes from DATABASE_URL, not from this file.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
