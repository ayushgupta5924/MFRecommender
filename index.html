    <script>
      // Apply the colour theme before the first paint (src/theme.jsx): ?theme= in the link, else the saved one.
      try {
        var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("mfa:theme");
        if (t === "midnight" || t === "gold" || t === "daylight") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
