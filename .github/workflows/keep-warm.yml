name: Keep backend warm

# Render's free tier sleeps after 15 idle minutes and takes up to a minute to
# wake, which is what a first-time visitor would see. One always-on free
# service fits inside Render's 750 free hours a month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://mf-advisor-backend-jfq5.onrender.com/api/health
