name: Refresh fund rankings

on:
  schedule:
    # 00:30 IST, after AMFI publishes the day's NAVs
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rankings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build rankings
        run: python -m scripts.build_rankings

      - name: Test against new data
        run: python -m pytest -q tests

      - name: Commit if changed
        run: |
          git add -N app/data/fund_facts.json app/data/holdings.json 2>/dev/null || true
          if git diff --quiet -- app/data/rankings.json app/data/scheme_map.json app/data/fund_facts.json app/data/holdings.json; then
            echo "Rankings unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/rankings.json app/data/scheme_map.json app/data/fund_facts.json app/data/holdings.json
          git commit -m "data: refresh fund rankings [skip render]"
          git push
